version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: konkuwan
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - ...
  frontend:
    build: ./client
    ports:
      - "80:80"
volumes:
  pgdata: